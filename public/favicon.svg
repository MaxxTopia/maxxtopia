<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Dark squircle backdrop -->
  <rect width="24" height="24" rx="5.5" fill="#0a0612"/>
  <rect width="24" height="24" rx="5.5" fill="url(#mx-bg)" opacity="0.55"/>

  <defs>
    <radialGradient id="mx-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#322361"/>
      <stop offset="100%" stop-color="#0a0612" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cyan back layer, offset right + down -->
  <path
    d="M 4 19.5 L 4 4.5 L 12 13.5 L 20 4.5 L 20 19.5"
    stroke="#00d4ff" stroke-width="3.2"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.9"
    transform="translate(1.1 0.4)"
  />

  <!-- Magenta middle layer, offset left + up -->
  <path
    d="M 4 19.5 L 4 4.5 L 12 13.5 L 20 4.5 L 20 19.5"
    stroke="#e25bff" stroke-width="3.2"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.9"
    transform="translate(-1.1 -0.4)"
  />

  <!-- White core front layer (crisp center) -->
  <path
    d="M 4 19.5 L 4 4.5 L 12 13.5 L 20 4.5 L 20 19.5"
    stroke="#ffffff" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none"
  />
</svg>
