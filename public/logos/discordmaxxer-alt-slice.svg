<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8a98ff"/>
      <stop offset="35%"  stop-color="#5865F2"/>
      <stop offset="70%"  stop-color="#404eed"/>
      <stop offset="100%" stop-color="#2c34c4"/>
    </linearGradient>
    <linearGradient id="sl-hi" x1="50%" y1="0%" x2="50%" y2="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sl-shade" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="sl-bubble" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaff"/>
    </linearGradient>
    <filter id="sl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a0a40" flood-opacity="0.42"/>
    </filter>
    <filter id="sl-fragShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a0a40" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>

  <!-- Apple squircle. -->
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#sl-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#sl-hi)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#sl-shade)"/>
  <rect x="65" y="65" width="894" height="894" rx="219" ry="219"
        fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Suite-signature speed accents — read as the *exhaust* of the cleaved
       fragment moving up-right, not as decoration. -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round" fill="none">
    <line x1="772" y1="208" x2="868" y2="252" stroke-width="14"/>
    <line x1="792" y1="288" x2="864" y2="320" stroke-width="11"/>
    <line x1="810" y1="356" x2="858" y2="378" stroke-width="9"/>
  </g>

  <!-- THE CHAT BUBBLE — with a 30° diagonal slice taken out of the upper-right.
       Path runs counter-clockwise from the top-left corner: across the top to
       the slice origin, down the cleaved edge, then continues round the right /
       bottom / tail / left as a normal speech bubble. -->
  <g filter="url(#sl-shadow)">
    <path d="M 350 290
             L 568 290
             L 770 624
             A 110 110 0 0 1 660 720
             L 470 720
             L 360 808
             L 386 720
             L 320 720
             A 110 110 0 0 1 210 610
             L 210 400
             A 110 110 0 0 1 320 290 Z"
          fill="url(#sl-bubble)"/>
  </g>

  <!-- THE CLEAVED FRAGMENT — small triangular shard floating up-right of the
       cut edge, mid-flight. Roughly 50% opacity = "leaving" not "arriving". -->
  <g filter="url(#sl-fragShadow)" opacity="0.62">
    <path d="M 632 244
             L 720 244
             L 808 388
             Z"
          fill="url(#sl-bubble)"/>
  </g>

  <!-- Three particle trails between the fragment and the speed accents — the
       cleaved bloat dissolving into nothing. Fades to the upper-right corner. -->
  <g fill="#ffffff">
    <circle cx="700" cy="220" r="9" opacity="0.55"/>
    <circle cx="730" cy="208" r="6" opacity="0.40"/>
    <circle cx="754" cy="200" r="4" opacity="0.25"/>
  </g>

  <!-- THE I-BEAM CURSOR — single vertical bar with serifs, in Discord blurple.
       Replaces the typing-dot cliché. Reads as "input cursor / pure intent."
       Positioned center-left of the bubble's surviving mass. -->
  <g fill="#5865F2">
    <!-- Top serif -->
    <rect x="416" y="438" width="60" height="12" rx="3"/>
    <!-- Vertical stem -->
    <rect x="438" y="438" width="16" height="178" rx="3"/>
    <!-- Bottom serif -->
    <rect x="416" y="604" width="60" height="12" rx="3"/>
  </g>
</svg>
