<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Discord-blurple radial — top-left specular bias for a "lit from above"
         feel on a circular face. -->
    <radialGradient id="sl-bg" cx="35%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#8a98ff"/>
      <stop offset="35%"  stop-color="#5865F2"/>
      <stop offset="75%"  stop-color="#404eed"/>
      <stop offset="100%" stop-color="#2c34c4"/>
    </radialGradient>

    <!-- Top-edge specular highlight, faked for a circle by clipping a vertical
         gradient to the same circle. -->
    <linearGradient id="sl-hi" x1="50%" y1="0%" x2="50%" y2="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom-edge depth shade. -->
    <linearGradient id="sl-shade" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Bubble face — white with a faint blue tint at the bottom edge. -->
    <linearGradient id="sl-bubble" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaff"/>
    </linearGradient>

    <!-- THE MAXXER SIGNATURE — magenta brand-shimmer for the cleaved
         fragment. This colour is the same gradient used in the wordmark's
         "maxxer" suffix, so the logo literally equals: Discord (blurple bubble)
         + Maxxer (magenta excess) - Slice (the act of optimization). -->
    <linearGradient id="sl-maxxer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f37bff"/>
      <stop offset="50%"  stop-color="#e25bff"/>
      <stop offset="100%" stop-color="#7d51f7"/>
    </linearGradient>

    <filter id="sl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a0a40" flood-opacity="0.42"/>
    </filter>
    <filter id="sl-fragShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3d0066" flood-opacity="0.42"/>
    </filter>

    <!-- Clip paths so the highlight + shade follow the circle silhouette. -->
    <clipPath id="sl-circle">
      <circle cx="512" cy="512" r="448"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>

  <!-- Circular face — replaces the squircle. Makes discordmaxxer the only
       round mark in the suite, which makes it visually pop in the sidebar. -->
  <circle cx="512" cy="512" r="448" fill="url(#sl-bg)"/>
  <g clip-path="url(#sl-circle)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sl-hi)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#sl-shade)"/>
  </g>

  <!-- Crisp inner ring on the circle silhouette. -->
  <circle cx="512" cy="512" r="447"
          fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Outer maxxer-magenta hairline — the suite-canon accent ring, very
       subtle, signals "this is a maxxer product" without crowding. -->
  <circle cx="512" cy="512" r="455"
          fill="none" stroke="url(#sl-maxxer)" stroke-opacity="0.42" stroke-width="3"/>

  <!-- Suite-signature speed accents — read as the exhaust of the cleaved
       fragment moving up-right. White, dissolves the magenta trail into
       suite canon. -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round" fill="none">
    <line x1="772" y1="232" x2="858" y2="272" stroke-width="14"/>
    <line x1="788" y1="304" x2="852" y2="332" stroke-width="11"/>
    <line x1="804" y1="364" x2="848" y2="384" stroke-width="9"/>
  </g>

  <!-- THE CHAT BUBBLE — kept from E. Speech bubble silhouette with a 30°
       diagonal slice taken out of the upper-right. Counter-clockwise path:
       top edge → cleaved diagonal → right side → tail at bottom-left. -->
  <g filter="url(#sl-shadow)">
    <path d="M 350 304
             L 568 304
             L 766 624
             A 110 110 0 0 1 656 720
             L 470 720
             L 360 808
             L 386 720
             L 320 720
             A 110 110 0 0 1 210 610
             L 210 414
             A 110 110 0 0 1 320 304 Z"
          fill="url(#sl-bubble)"/>
  </g>

  <!-- THE CLEAVED FRAGMENT — now in MAXXER MAGENTA, not white. This is the
       brand idea baked into the form: the wordmark is "Discord" (white) +
       "maxxer" (magenta shimmer); the logo is the same. The fragment is
       the magenta excess being shed, leaving the blurple Discord essence. -->
  <g filter="url(#sl-fragShadow)" opacity="0.85">
    <path d="M 632 258
             L 718 258
             L 802 392
             Z"
          fill="url(#sl-maxxer)"/>
  </g>

  <!-- Particle trail — magenta dissolving into white as it approaches the
       speed-accent lines. Maxxer signature evaporating into pure suite. -->
  <g>
    <circle cx="700" cy="232" r="9" fill="url(#sl-maxxer)" opacity="0.78"/>
    <circle cx="730" cy="220" r="6" fill="#f37bff" opacity="0.55"/>
    <circle cx="754" cy="208" r="4" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- I-BEAM CURSOR — Discord blurple, brutalist. The single point of input.
       Replaces the typing-dot cliché. Centered in the surviving bubble mass. -->
  <g fill="#5865F2">
    <rect x="416" y="450" width="60" height="12" rx="3"/>
    <rect x="438" y="450" width="16" height="178" rx="3"/>
    <rect x="416" y="616" width="60" height="12" rx="3"/>
  </g>
</svg>
