<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Discord-blurple-anchored gradient: lavender → blurple → cobalt → indigo.
         Sits in the same Apple-icon family as the suite's other logos but uses
         Discord's brand center (#5865F2) so the icon reads "Discord" instantly. -->
    <linearGradient id="dm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8a98ff"/>
      <stop offset="35%"  stop-color="#5865F2"/>
      <stop offset="70%"  stop-color="#404eed"/>
      <stop offset="100%" stop-color="#2c34c4"/>
    </linearGradient>

    <!-- Top specular highlight for "lit from above" Apple-icon feel. -->
    <linearGradient id="dm-hi" x1="50%" y1="0%" x2="50%" y2="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom shade overlay for depth. -->
    <linearGradient id="dm-bottomShade" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Bubble face: white with the faintest blue tint at the bottom edge. -->
    <linearGradient id="dm-bubbleFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaff"/>
    </linearGradient>

    <!-- Drop shadow gives the bubble visible lift off the squircle face. -->
    <filter id="dm-bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a0a40" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Outer transparent canvas -->
  <rect width="1024" height="1024" fill="transparent"/>

  <!-- Apple-style squircle (corner radius ≈ 22% of side) -->
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#dm-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#dm-hi)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#dm-bottomShade)"/>

  <!-- Crisp 1px inner stroke. -->
  <rect x="65" y="65" width="894" height="894" rx="219" ry="219"
        fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Three speed accent lines (top-right) — keeps the maxxer family signature. -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round" fill="none">
    <line x1="772" y1="208" x2="868" y2="252" stroke-width="14"/>
    <line x1="792" y1="288" x2="864" y2="320" stroke-width="11"/>
    <line x1="810" y1="356" x2="858" y2="378" stroke-width="9"/>
  </g>

  <!-- Chat bubble — rounded rect with a tail at the bottom-left, the universal
       "this is a comms app" silhouette. Centered with generous padding. -->
  <g filter="url(#dm-bubbleShadow)">
    <path d="M 320 290
             L 704 290
             A 110 110 0 0 1 814 400
             L 814 600
             A 110 110 0 0 1 704 710
             L 470 710
             L 360 800
             L 380 710
             L 320 710
             A 110 110 0 0 1 210 600
             L 210 400
             A 110 110 0 0 1 320 290 Z"
          fill="url(#dm-bubbleFill)"/>
  </g>

  <!-- Typing-indicator dots in Discord blurple — communicates "active comms"
       without using Discord's actual mark (avoids trademark issues). -->
  <g fill="#5865F2">
    <circle cx="380" cy="500" r="42"/>
    <circle cx="512" cy="500" r="42"/>
    <circle cx="644" cy="500" r="42"/>
  </g>
</svg>
