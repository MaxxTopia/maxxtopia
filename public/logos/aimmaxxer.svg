<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    AIMMAXXER mark — the Sharingan (aimmaxxer v2 identity). A crimson iris,
    black pupil, three black tomoe. An eye = AI vision = aim; on-brand with
    the suite's Sharingan motif.
  -->
  <defs>
    <radialGradient id="am-iris" cx="50%" cy="44%" r="58%">
      <stop offset="0%"  stop-color="#ff4b3e"/>
      <stop offset="55%" stop-color="#d11820"/>
      <stop offset="100%" stop-color="#7e0a10"/>
    </radialGradient>
    <filter id="am-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- dark rim + iris -->
  <circle cx="100" cy="100" r="92" fill="#1c0305"/>
  <circle cx="100" cy="100" r="86" fill="url(#am-iris)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#3c060a" stroke-width="4"/>
  <!-- faint inner radial ring -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#5a0b10" stroke-width="2" opacity="0.55"/>

  <!-- pupil -->
  <circle cx="100" cy="100" r="16" fill="#0c0406"/>

  <!-- three magatama tomoe (round head + tail tapering to a point),
       rotated 0 / 120 / 240 around the eye centre -->
  <g fill="#0c0406" filter="url(#am-soft)">
    <g transform="rotate(0 100 100) translate(100 54) scale(1.25)">
      <path d="M 0,-13 C 7,-13 13,-7.2 13,0 C 13,9.4 5,15.5 -7,18.5
               C -1.5,11 1.6,5.4 1.6,0 C 1.6,-4 -1.2,-6.8 -5,-6.8
               C -9.7,-6.8 -13,-3 -13,1.8 C -13,-6.8 -7,-13 0,-13 Z"/>
    </g>
    <g transform="rotate(120 100 100) translate(100 54) scale(1.25)">
      <path d="M 0,-13 C 7,-13 13,-7.2 13,0 C 13,9.4 5,15.5 -7,18.5
               C -1.5,11 1.6,5.4 1.6,0 C 1.6,-4 -1.2,-6.8 -5,-6.8
               C -9.7,-6.8 -13,-3 -13,1.8 C -13,-6.8 -7,-13 0,-13 Z"/>
    </g>
    <g transform="rotate(240 100 100) translate(100 54) scale(1.25)">
      <path d="M 0,-13 C 7,-13 13,-7.2 13,0 C 13,9.4 5,15.5 -7,18.5
               C -1.5,11 1.6,5.4 1.6,0 C 1.6,-4 -1.2,-6.8 -5,-6.8
               C -9.7,-6.8 -13,-3 -13,1.8 C -13,-6.8 -7,-13 0,-13 Z"/>
    </g>
  </g>
</svg>
