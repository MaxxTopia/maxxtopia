<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="dm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8a98ff"/>
      <stop offset="35%"  stop-color="#5865F2"/>
      <stop offset="70%"  stop-color="#404eed"/>
      <stop offset="100%" stop-color="#2c34c4"/>
    </linearGradient>
    <linearGradient id="dm-hi" x1="50%" y1="0%" x2="50%" y2="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dm-shade" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="dm-mono" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaff"/>
    </linearGradient>
    <filter id="dm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a0a40" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#dm-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#dm-hi)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#dm-shade)"/>
  <rect x="65" y="65" width="894" height="894" rx="219" ry="219"
        fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Speed accent lines top-right -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round" fill="none">
    <line x1="772" y1="208" x2="868" y2="252" stroke-width="14"/>
    <line x1="792" y1="288" x2="864" y2="320" stroke-width="11"/>
    <line x1="810" y1="356" x2="858" y2="378" stroke-width="9"/>
  </g>

  <!-- Lowercase "d" monogram — geometric rounded letterform.
       Vertical stem on the right, large "o" bowl. Built from primitives so it
       renders crisp at every size and doesn't depend on font availability. -->
  <g filter="url(#dm-shadow)">
    <!-- Bowl: outer disc -->
    <circle cx="448" cy="612" r="180" fill="url(#dm-mono)"/>
    <!-- Bowl: inner counter (creates the "O" shape) -->
    <circle cx="448" cy="612" r="80" fill="url(#dm-bg)"/>
    <!-- Stem: tall rounded rect on the right -->
    <rect x="612" y="252" width="106" height="540" rx="53" ry="53" fill="url(#dm-mono)"/>
    <!-- Joint cleanup: small overlap rect to fuse stem with bowl -->
    <rect x="612" y="492" width="60" height="240" fill="url(#dm-mono)"/>
  </g>

  <!-- Tiny presence pip — green online dot at lower-right, signals "comms live".
       Discord uses #43b581-ish for online; we lean toward a softer mint. -->
  <g filter="url(#dm-shadow)">
    <circle cx="752" cy="788" r="44" fill="#3ba55d"/>
    <circle cx="752" cy="788" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6"/>
  </g>
</svg>
