<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8a98ff"/>
      <stop offset="35%"  stop-color="#5865F2"/>
      <stop offset="70%"  stop-color="#404eed"/>
      <stop offset="100%" stop-color="#2c34c4"/>
    </linearGradient>
    <linearGradient id="wv-hi" x1="50%" y1="0%" x2="50%" y2="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wv-shade" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="wv-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaff"/>
    </linearGradient>
    <filter id="wv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0a40" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#wv-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#wv-hi)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#wv-shade)"/>
  <rect x="65" y="65" width="894" height="894" rx="219" ry="219"
        fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Broadcast burst — three concentric arcs emanating from a center node.
       Reads as "comms / signal / live" and clearly NOT a lightning bolt.
       Arc pairs (left + right) for symmetry; widest = furthest signal. -->
  <g filter="url(#wv-shadow)" stroke="url(#wv-stroke)" stroke-linecap="round" fill="none">
    <!-- Inner pair -->
    <path d="M 416 380 A 140 140 0 0 0 416 644" stroke-width="44"/>
    <path d="M 608 380 A 140 140 0 0 1 608 644" stroke-width="44"/>
    <!-- Middle pair -->
    <path d="M 348 320 A 220 220 0 0 0 348 704" stroke-width="38" stroke-opacity="0.85"/>
    <path d="M 676 320 A 220 220 0 0 1 676 704" stroke-width="38" stroke-opacity="0.85"/>
    <!-- Outer pair -->
    <path d="M 280 260 A 300 300 0 0 0 280 764" stroke-width="32" stroke-opacity="0.55"/>
    <path d="M 744 260 A 300 300 0 0 1 744 764" stroke-width="32" stroke-opacity="0.55"/>
  </g>

  <!-- Center node — the source. Solid disc with inner highlight ring. -->
  <g filter="url(#wv-shadow)">
    <circle cx="512" cy="512" r="78" fill="url(#wv-stroke)"/>
    <circle cx="512" cy="512" r="40" fill="#5865F2"/>
  </g>
</svg>
