<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="hs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8a98ff"/>
      <stop offset="35%"  stop-color="#5865F2"/>
      <stop offset="70%"  stop-color="#404eed"/>
      <stop offset="100%" stop-color="#2c34c4"/>
    </linearGradient>
    <linearGradient id="hs-hi" x1="50%" y1="0%" x2="50%" y2="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hs-shade" x1="50%" y1="60%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="hs-cup" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f4f5ff"/>
      <stop offset="100%" stop-color="#dde0ff"/>
    </linearGradient>
    <filter id="hs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a0a40" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="transparent"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#hs-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#hs-hi)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#hs-shade)"/>
  <rect x="65" y="65" width="894" height="894" rx="219" ry="219"
        fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Headset arc band — connects the two cans across the top -->
  <g filter="url(#hs-shadow)">
    <path d="M 256 540
             A 256 256 0 0 1 768 540"
          fill="none" stroke="url(#hs-cup)" stroke-width="56"
          stroke-linecap="round"/>
  </g>

  <!-- Left ear cup -->
  <g filter="url(#hs-shadow)">
    <rect x="200" y="510" width="170" height="240" rx="56" ry="56" fill="url(#hs-cup)"/>
    <!-- Driver cutout: subtle inset circle -->
    <circle cx="285" cy="630" r="58" fill="#5865F2" opacity="0.85"/>
    <circle cx="285" cy="630" r="32" fill="#2c34c4"/>
  </g>

  <!-- Right ear cup -->
  <g filter="url(#hs-shadow)">
    <rect x="654" y="510" width="170" height="240" rx="56" ry="56" fill="url(#hs-cup)"/>
    <circle cx="739" cy="630" r="58" fill="#5865F2" opacity="0.85"/>
    <circle cx="739" cy="630" r="32" fill="#2c34c4"/>
  </g>

  <!-- Boom mic — short angled rod with capsule, signals "comms" -->
  <g filter="url(#hs-shadow)">
    <path d="M 285 750
             L 380 820"
          stroke="url(#hs-cup)" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="395" cy="828" rx="32" ry="18" fill="url(#hs-cup)" transform="rotate(36 395 828)"/>
  </g>

  <!-- Speed accent lines top-right (suite family signature) -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round" fill="none">
    <line x1="772" y1="208" x2="868" y2="252" stroke-width="14"/>
    <line x1="792" y1="288" x2="864" y2="320" stroke-width="11"/>
    <line x1="810" y1="356" x2="858" y2="378" stroke-width="9"/>
  </g>
</svg>
