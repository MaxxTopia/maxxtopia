<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    Aimmaxxer rail icon — a BULLSEYE (concentric rings, no crosshair so it stays
    distinct from snipemaxxer's scope). Gold canon accent. Replaces the "AM" monogram.
  -->
  <defs>
    <linearGradient id="am-bull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffd45b"/>
      <stop offset="100%" stop-color="#f3af19"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="12" cy="12" r="8.6" fill="none" stroke="url(#am-bull)" stroke-width="2"/>
  <!-- Middle ring -->
  <circle cx="12" cy="12" r="5"   fill="none" stroke="url(#am-bull)" stroke-width="2"/>
  <!-- Center -->
  <circle cx="12" cy="12" r="2.1" fill="url(#am-bull)"/>
</svg>
