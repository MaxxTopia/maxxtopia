name: Sync Optimizationmaxxing release

# Mirror of sync-discordmaxxer-release.yml but for optimizationmaxxing.
# Listens for the `optimizationmaxxing-released` repository_dispatch event
# fired by MaxxTopia/optimizationmaxxing's release CI after a new tag
# publishes. Rewrites src/data/optimizationmaxxing-release.json with the
# new payload, commits, pushes — Cloudflare Pages auto-deploys main.

on:
    repository_dispatch:
        types: [optimizationmaxxing-released]
    workflow_dispatch:
        inputs:
            version:
                description: "Tag (e.g. v0.1.7)"
                required: true
            installer_url:
                description: "Direct .exe download URL"
                required: true
            release_page_url:
                description: "Release page URL"
                required: true

permissions:
    contents: write
    actions: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Resolve payload
              id: payload
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
                      echo "installer_url=${{ github.event.inputs.installer_url }}" >> "$GITHUB_OUTPUT"
                      echo "release_page_url=${{ github.event.inputs.release_page_url }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
                      echo "installer_url=${{ github.event.client_payload.installerUrl }}" >> "$GITHUB_OUTPUT"
                      echo "release_page_url=${{ github.event.client_payload.releasePageUrl }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Rewrite release JSON
              env:
                  VERSION: ${{ steps.payload.outputs.version }}
                  INSTALLER_URL: ${{ steps.payload.outputs.installer_url }}
                  RELEASE_PAGE_URL: ${{ steps.payload.outputs.release_page_url }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const path = "src/data/optimizationmaxxing-release.json";
                    const data = {
                        version: process.env.VERSION,
                        installerUrl: process.env.INSTALLER_URL,
                        releasePageUrl: process.env.RELEASE_PAGE_URL,
                        publishedAt: new Date().toISOString()
                    };
                    fs.writeFileSync(path, JSON.stringify(data, null, 4) + "\n");
                    console.log("wrote", path, JSON.stringify(data));
                  '

            # Curated changelog: if the GitHub release for this tag carries a
            # `## Highlights` section, parse it into a clean /updates entry.
            # Releases without that section just bump the version (no spam).
            # continue-on-error so a changelog hiccup never blocks the deploy.
            - name: Sync changelog from release notes
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.payload.outputs.version }}
              run: |
                  if gh api "repos/MaxxTopia/optimizationmaxxing/releases/tags/$VERSION" > release.json; then
                      node -e '
                        const fs = require("fs");
                        const r = JSON.parse(fs.readFileSync("release.json", "utf8"));
                        fs.writeFileSync("release-input.json", JSON.stringify({
                            product: "Optimizationmaxxing",
                            slug: "optimizationmaxxing",
                            version: process.env.VERSION,
                            name: r.name || "",
                            date: r.published_at || "",
                            body: r.body || ""
                        }));
                      '
                      node scripts/release-note-to-changelog.mjs release-input.json
                      rm -f release.json release-input.json
                  else
                      echo "No GitHub release found for tag $VERSION — version bumped, no changelog entry."
                  fi

            - name: Commit + push
              id: commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/optimizationmaxxing-release.json src/data/changelog.json
                  if git diff --cached --quiet; then
                      echo "No changes — already at latest version."
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      git commit -m "sync: optimizationmaxxing ${{ steps.payload.outputs.version }}"
                      git push
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # GitHub Actions does NOT trigger workflows from a GITHUB_TOKEN
            # push (security measure to prevent loops). So our git push
            # above won't fire deploy.yml on its own — we have to fire
            # the workflow explicitly. `gh workflow run` uses the
            # ambient GITHUB_TOKEN with `actions: write` permission.
            - name: Trigger deploy.yml
              if: steps.commit.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run deploy.yml --ref main
