name: Sync Dropmaxxer release

# Listens for the `dropmaxxer-released` repository_dispatch event from
# MaxxTopia/dropmaxxer's release CI. Rewrites src/data/dropmaxxer-release.json
# with the new payload, commits, pushes — Cloudflare Pages auto-deploys.

on:
    repository_dispatch:
        types: [dropmaxxer-released]
    workflow_dispatch:
        inputs:
            version:
                description: "Tag (e.g. v0.1.0)"
                required: true
            installer_url:
                description: "Direct installer download URL"
                required: true
            release_page_url:
                description: "Release page URL"
                required: true

permissions:
    contents: write
    actions: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Resolve payload
              id: payload
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
                      echo "installer_url=${{ github.event.inputs.installer_url }}" >> "$GITHUB_OUTPUT"
                      echo "release_page_url=${{ github.event.inputs.release_page_url }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
                      echo "installer_url=${{ github.event.client_payload.installerUrl }}" >> "$GITHUB_OUTPUT"
                      echo "release_page_url=${{ github.event.client_payload.releasePageUrl }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Rewrite release JSON
              env:
                  VERSION: ${{ steps.payload.outputs.version }}
                  INSTALLER_URL: ${{ steps.payload.outputs.installer_url }}
                  RELEASE_PAGE_URL: ${{ steps.payload.outputs.release_page_url }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const path = "src/data/dropmaxxer-release.json";
                    const data = {
                        version: process.env.VERSION,
                        installerUrl: process.env.INSTALLER_URL,
                        releasePageUrl: process.env.RELEASE_PAGE_URL,
                        publishedAt: new Date().toISOString()
                    };
                    fs.writeFileSync(path, JSON.stringify(data, null, 4) + "\n");
                    console.log("wrote", path, JSON.stringify(data));
                  '

            - name: Commit + push
              id: commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/dropmaxxer-release.json
                  if git diff --cached --quiet; then
                      echo "No changes — already at latest version."
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      git commit -m "sync: dropmaxxer ${{ steps.payload.outputs.version }}"
                      git push
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # GitHub Actions does NOT trigger workflows from a GITHUB_TOKEN
            # push (loop-prevention). Fire deploy.yml explicitly.
            - name: Trigger deploy.yml
              if: steps.commit.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run deploy.yml --ref main
