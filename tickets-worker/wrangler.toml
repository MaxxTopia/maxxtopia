name = "maxxtopia-tickets"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Public-facing env vars. The DISCORD_PUBLIC_KEY is intentionally NOT a
# secret — public keys are meant to be public, that's the point of asymmetric
# crypto (anyone can verify a signature, only Discord with the private half
# can sign one). Committing it here saves Diggy a `wrangler secret put`
# command + makes auditability easy. The BOT TOKEN is the actual secret —
# see DISCORD_BOT_TOKEN below.
[vars]
DISCORD_GUILD_ID = "794160379767947264"
OPEN_TICKET_CHANNEL_ID = "1502870740360368148"
DIGGY_USER_ID = "426146621424664586"
SUPPORT_ROLE_ID = "1502864513022558290"  # @MAXXER++
DISCORD_PUBLIC_KEY = "5e02ffe270cee8d4599190288eb2c216066ba2f9048d31dcb4dc0849bebcb508"
# Closed-ticket transcripts get archived here (mod-only channel created
# 2026-05-10 by maxxtopia-server-setup.mjs).
TICKET_ARCHIVE_CHANNEL_ID = "1502881819522236527"
# Role granted by the "Grant VIP" button. Defaults to the @VIP role
# created in v1; if we ever split per-product VIP roles, add that here.
VIP_ROLE_ID = "1502870738313674954"
# The original Forum surface remains available as a recoverable archive.
FEEDBACK_CHANNEL_ID = "1502867387962101812"
FEEDBACK_THREAD_ID = "1539270897024897075"
# Normal read-only review channel. /review publishes here; the legacy IDs
# above remain accepted during the migration window.
FEEDBACK_REVIEW_CHANNEL_ID = "1543384589106679871"
# Sprite Cannon coin-code worker that /sccoins mints against (POST /admin/gen).
# The URL is public; the admin token is the SECRET SC_CODES_ADMIN_TOKEN (see bottom).
SC_CODES_URL = "https://spritecannon-codes.maxxtopia.workers.dev"

# Per-user click rate-limit (1 ticket per 60s). Without this, click-spam
# could DoS our Discord REST budget. KV is dirt-cheap for this.
[[kv_namespaces]]
binding = "TICKETS_RATELIMIT"
id = "22c7543edfc248059e8eca493224c8e5"
# Note: wrangler suggests `binding = "tickets_ratelimit"` (lowercase) on
# create — we deliberately use UPPERCASE to match `env.TICKETS_RATELIMIT`
# in worker.js. Same convention as vip-worker (`VIP_CLAIMS`) and
# telemetry-worker (`TELEMETRY`).

# Founder pool — pre-minted FNDR* codes /33 pulls from. Only used by
# /33; other slash commands mint codes on demand. Keys:
#   unused:founder:<code>  -> "1"
#
# Created 2026-05-11 via `wrangler kv namespace create vip-code-pool`.
[[kv_namespaces]]
binding = "VIP_CODE_POOL"
id = "3a7ab0ad53cb4ca0995cc5021f6e347e"

# Shared with vip-worker. We write `meta:<code> → {tier, scope,
# durationMs, mintedAt}` here at /gen-time so vip-worker can derive
# tier + scope + expiresAt when the user claims. The vip-worker also
# uses this same namespace for its own `claim:<code>` records — the
# two key prefixes don't collide.
#
# Namespace ID is the same one vip-worker binds (see
# optimizationmaxxing/vip-worker/wrangler.toml).
[[kv_namespaces]]
binding = "VIP_CLAIMS"
id = "06752792b28c4e5e9d3ed3d48d3278ec"

# Secrets to set (one-time, only the bot token is actually secret):
#   wrangler secret put DISCORD_BOT_TOKEN       # from .bot-setup.local.env or the Discord dev portal "Bot" tab
#   wrangler secret put SC_CODES_ADMIN_TOKEN    # = streammaxxing/spritecannon-codes/.admin-token (lets /sccoins mint codes)
